plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

version = mod_version
group = mod_group_id

repositories {
    maven {
        url = "https://maven.blamejared.com"
        content {
            includeGroup "mezz.jei"
        }
    }
    maven {
        url = "https://maven.theillusivec4.top"
        content {
            includeGroup "top.theillusivec4.curios"
        }
    }
    maven {
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    ivy {
        name = "MCphoneGitHubReleases"
        url = uri("https://github.com/november521/mcphone/releases/download")
        patternLayout {
            artifact "v[revision]/[artifact]-[revision].[ext]"
        }
        metadataSources {
            artifact()
        }
        content {
            includeModule "com.november.mcphone", "mcphone"
        }
    }
}

base {
    archivesName = mod_id
}

// Minecraft 1.21.1 ships with Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Curios is required; prefer the installed development JAR and use its API in CI.
    def manualCuriosJar = file("run/mods/curios-neoforge-${curios_version}.jar")
    if (manualCuriosJar.isFile()) {
        compileOnly files(manualCuriosJar)
    } else {
        compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    }

    // Optional integrations are compile-only and never bundled.
    def manualJeiJar = fileTree("run/mods").matching { include "*jei*.jar" }.files.find()
    if (manualJeiJar != null) {
        compileOnly files(manualJeiJar)
    } else {
        compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    }

    def madnessCoreApiJar = providers.gradleProperty("madnesscore_compile_jar")
            .map { file(it) }
            .getOrElse(file("../MadnessCore/build/libs/madnesscore-1.0.0.jar"))
    compileOnly files(madnessCoreApiJar)
    if (providers.gradleProperty("withMadnessCore").orElse("false").get().toBoolean()) {
        localRuntime files(madnessCoreApiJar)
    }

    compileOnly "maven.modrinth:jade:${jade_version}"
    localRuntime "maven.modrinth:jade:${jade_version}"

    def manualMcphoneJar = file("run/mods/mcphone-${mcphone_version}.jar")
    if (providers.gradleProperty("mcphone_compile_jar").isPresent()) {
        compileOnly files(providers.gradleProperty("mcphone_compile_jar").get())
    } else if (manualMcphoneJar.isFile()) {
        compileOnly files(manualMcphoneJar)
    } else {
        compileOnly "com.november.mcphone:mcphone:${mcphone_version}"
    }

    def manualTouhouLittleMaidJar = file("run/mods/touhoulittlemaid-${touhou_little_maid_version}.jar")
    if (providers.gradleProperty("touhou_little_maid_compile_jar").isPresent()) {
        compileOnly files(providers.gradleProperty("touhou_little_maid_compile_jar").get())
    } else if (manualTouhouLittleMaidJar.isFile()) {
        compileOnly files(manualTouhouLittleMaidJar)
    } else {
        compileOnly "maven.modrinth:touhou-little-maid:${touhou_little_maid_version}"
    }
}

def generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
