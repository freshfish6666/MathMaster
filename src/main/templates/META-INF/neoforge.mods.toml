# 模组元数据；版本和运行范围由 Gradle 展开。
modLoader="javafml"

loaderVersion="${loader_version_range}"

license="${mod_license}"

[[mods]]

modId="${mod_id}"

version="${mod_version}"

displayName="${mod_name}"

logoFile="mathmaster.png"

authors="freshfish6666"

description='''
MathMaster - 数学大师：以数学问答、公理技能、智识成长与数字化污染为核心的冒险模组。
研读数学书、演绎公理，并通过公理匣掌握主动技能与被动能力。
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

# 测地线使用局部 Mixin；字体访问沿用默认的 META-INF/accesstransformer.cfg。
[[mixins]]
    config="mathmaster.mixins.json"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Curios 为双端必需前置；其余联动保持可选。
[[dependencies.${mod_id}]]
    modId="curios"
    type="required"
    reason="MathMaster uses Curios slots for axiom cases and the digital pollution meter."
    versionRange="[9.5.1,10.0.0)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="jade"
    type="optional"
    versionRange="[15.10.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[19.0.0,)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="mcphone"
    type="optional"
    versionRange="[1.8.19,)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="touhou_little_maid"
    type="optional"
    versionRange="[1.5.3,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="madnesscore"
    type="optional"
    versionRange="[1.0.0,2.0.0)"
    ordering="AFTER"
    side="BOTH"
